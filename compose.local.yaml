services:
  bockge:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - 5001:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./data/stacks:/opt/stacks
    environment:
      - BOCKGE_STACKS_DIR=/opt/stacks
